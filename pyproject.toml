[project]
name = "ingestor-tui"
version = "0.1.0"
description = "Textual TUI for the Gmail Ingestor pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gmail-ingestor",
    "textual>=1.0.0",
]

[tool.uv.sources]
gmail-ingestor = { path = "../gmail-ingestor", editable = true }

[project.scripts]
ingestor-tui = "ingestor_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "textual-dev>=1.0.0",
]
